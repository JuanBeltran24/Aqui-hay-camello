<!-- Navbar variante registro -->
<app-navbar variant="register" />

<main class="registro-page">
  <div class="registro-card">

    <!-- Encabezado -->
    <div class="registro-card__header">
      <div class="registro-card__header-text">
        <h1>Crear cuenta</h1>
        <h2 class="registro-card__gratis">GRATIS</h2>
        <p>Únete a nuestra plataforma y comienza a conectar con los mejores profesionales sin costo alguno.</p>
      </div>
      <div class="registro-card__header-icon" aria-hidden="true">
        <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.2">
          <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
          <rect x="9" y="3" width="6" height="4" rx="2" ry="2"/>
          <path d="M9 14l2 2 4-4"/>
        </svg>
      </div>
    </div>

    <!-- Formulario -->
    <form class="registro-form" (ngSubmit)="onSubmitCliente()">

      <div class="form-row">
        <!-- Nombre completo -->
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input
              id="nombre"
              type="text"
              placeholder="Ingresa tu nombre"
              [(ngModel)]="form.nombre"
              name="nombre"
              autocomplete="name"
            />
          </div>
        </div>

        <!-- Correo electrónico -->
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input
              id="email"
              type="email"
              placeholder="ejemplo@gmail.com"
              [(ngModel)]="form.email"
              name="email"
              autocomplete="email"
            />
          </div>
        </div>
      </div>

      <div class="form-row">
        <!-- Teléfono -->
        <div class="form-group">
          <label for="telefono">Teléfono <span class="label-optional">(opcional)</span></label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.24h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.02z"/></svg>
            <input
              id="telefono"
              type="tel"
              placeholder="Ingresa tu teléfono"
              [(ngModel)]="form.telefono"
              name="telefono"
              autocomplete="tel"
            />
          </div>
        </div>

        <!-- Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Crea tu contraseña"
              [(ngModel)]="form.password"
              name="password"
              autocomplete="new-password"
            />
            <button type="button" class="input-toggle" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <svg *ngIf="!showPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword"  width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Confirmar contraseña -->
      <div class="form-group form-group--full">
        <label for="confirmPassword">Confirmar contraseña</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            placeholder="Confirma tu contraseña"
            [(ngModel)]="form.confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
          />
          <button type="button" class="input-toggle" (click)="toggleConfirmPassword()" [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <svg *ngIf="!showConfirmPassword" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg *ngIf="showConfirmPassword"  width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Términos y condiciones -->
      <div class="form-check">
        <input
          type="checkbox"
          id="terminos"
          [(ngModel)]="form.aceptaTerminos"
          name="aceptaTerminos"
        />
        <label for="terminos">
          Acepto los <a routerLink="/">Términos y condiciones</a> y la <a routerLink="/">Política de privacidad</a>
        </label>
      </div>

      <!-- Botones de submit -->
      <div class="form-actions">
        <button type="submit" class="btn-primary btn-full">Crear cuenta gratis</button>
        <button type="button" class="btn-primary btn-full btn-profesional" (click)="onSubmitProfesional()">
          Crear cuenta gratis para profesionales
        </button>
      </div>

      <!-- Divisor -->
      <div class="form-divider">
        <span>o continuar con</span>
      </div>

      <!-- Social login -->
      <div class="social-login">
        <button type="button" class="social-btn">
          <!-- Google -->
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuar con Google
        </button>
        <button type="button" class="social-btn">
          <!-- Apple -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          Continuar con Apple
        </button>
      </div>

      <!-- Pie de seguridad -->
      <p class="form-security">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Tus datos están protegidos y son 100% seguros
      </p>

    </form>
  </div>
</main>
